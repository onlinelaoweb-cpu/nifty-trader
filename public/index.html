<!DOCTYPE html>
<html>
<head>
    <title>VardaanNifty AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            background:#080c10;
            color:#cfd8dc;
            font-family:Arial,sans-serif;
            padding:10px;
            min-height:100vh;
        }
        h1 {
            text-align:center;
            font-size:16px;
            color:#29b6f6;
            letter-spacing:3px;
            padding:8px 0;
            border-bottom:1px solid #1e3a5f;
            margin-bottom:10px;
        }
        .price-card {
            background:#0a1828;
            border:1px solid #1e3a5f;
            border-radius:10px;
            padding:12px;
            text-align:center;
            margin-bottom:8px;
        }
        .price-label { font-size:10px; color:#546e7a; letter-spacing:2px; }
        .price-value { font-size:32px; font-weight:700; color:#eceff1; font-family:monospace; margin:4px 0; }
        .price-change.up   { color:#00e676; font-size:13px; }
        .price-change.down { color:#ff1744; font-size:13px; }
        .price-change.flat { color:#78909c; font-size:13px; }

        .signal-card {
            border-radius:10px;
            padding:14px;
            text-align:center;
            margin-bottom:8px;
            border:2px solid;
        }
        .signal-card.buy-call { background:rgba(0,230,118,0.08); border-color:#00e676; }
        .signal-card.buy-put  { background:rgba(255,23,68,0.08);  border-color:#ff1744; }
        .signal-card.wait     { background:rgba(255,196,0,0.08);  border-color:#ffc400; }
        .signal-text { font-size:30px; font-weight:700; letter-spacing:3px; }
        .buy-call .signal-text { color:#00e676; }
        .buy-put  .signal-text { color:#ff1744; }
        .wait     .signal-text { color:#ffc400; }
        .conf-bar-wrap { background:#1e3a5f; border-radius:4px; height:8px; margin:8px 0 4px; overflow:hidden; }
        .conf-bar { height:100%; border-radius:4px; transition:width 0.5s ease; }
        .buy-call .conf-bar { background:#00e676; }
        .buy-put  .conf-bar { background:#ff1744; }
        .wait     .conf-bar { background:#ffc400; }
        .conf-text { font-size:11px; color:#78909c; }

        /* Strike Recommendation */
        .strike-card {
            background:#0a1828;
            border:1px solid #1e3a5f;
            border-radius:8px;
            padding:8px 12px;
            text-align:center;
            margin-bottom:8px;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .strike-label { font-size:10px; color:#546e7a; letter-spacing:1px; }
        .strike-value { font-size:13px; font-weight:700; color:#29b6f6; font-family:monospace; }

        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:8px; }
        .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:8px; }

        .ind-card {
            background:#0a1828;
            border:1px solid #1e3a5f;
            border-radius:8px;
            padding:10px;
            text-align:center;
        }
        .ind-label { font-size:10px; color:#546e7a; letter-spacing:1px; text-transform:uppercase; }
        .ind-value { font-size:18px; font-weight:700; font-family:monospace; margin-top:3px; }
        .ind-sub   { font-size:10px; color:#546e7a; margin-top:2px; }

        .bull { color:#00e676; border-left:3px solid #00e676 !important; }
        .bear { color:#ff1744; border-left:3px solid #ff1744 !important; }
        .neut { color:#ffc400; border-left:3px solid #ffc400 !important; }
        .blue { color:#29b6f6; }

        /* PCR + VIX Row */
        .pcr-vix-grid {
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:7px;
            margin-bottom:8px;
        }
        .pv-card {
            background:#0a1828;
            border:1px solid #1e3a5f;
            border-radius:8px;
            padding:8px;
            text-align:center;
        }
        .pv-label { font-size:9px; color:#546e7a; letter-spacing:1px; }
        .pv-value { font-size:16px; font-weight:700; font-family:monospace; margin:3px 0; }
        .pv-sig   { font-size:9px; font-weight:700; letter-spacing:1px; }

        .reason-card {
            background:#0a1828;
            border:1px solid #1e3a5f;
            border-radius:8px;
            padding:10px 12px;
            margin-bottom:8px;
        }
        .reason-title { font-size:10px; color:#546e7a; letter-spacing:2px; margin-bottom:6px; }
        .reason-item  { font-size:11px; color:#90a4ae; padding:3px 0; border-bottom:1px solid #1e3a5f; line-height:1.6; }
        .reason-item:last-child { border-bottom:none; }

        .footer { text-align:center; font-size:10px; color:#37474f; padding:6px 0; }
        .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; animation:pulse 2s infinite; }
        .dot.live    { background:#00e676; }
        .dot.offline { background:#546e7a; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
</head>
<body>

<h1>⚡ VARDAANNIFTY AI</h1>

<!-- Price -->
<div class="price-card">
    <div class="price-label">NIFTY 50</div>
    <div class="price-value" id="price">--</div>
    <div class="price-change flat" id="change">--</div>
</div>

<!-- Signal -->
<div class="signal-card wait" id="signal-card">
    <div class="signal-text" id="signal">WAIT</div>
    <div class="conf-bar-wrap">
        <div class="conf-bar" id="conf-bar" style="width:0%"></div>
    </div>
    <div class="conf-text" id="conf-text">Confidence: 0%</div>
</div>

<!-- Strike Recommendation -->
<div class="strike-card">
    <div>
        <div class="strike-label">🎯 STRIKE ZONE</div>
        <div class="strike-value" id="strike-range">ATM ±200</div>
    </div>
    <div style="text-align:right;">
        <div class="strike-label">STATUS</div>
        <div style="font-size:12px;" id="status-txt">
            <span class="dot offline" id="dot"></span>WAIT
        </div>
    </div>
</div>

<!-- PCR + VIX Row -->
<div class="pcr-vix-grid">
    <div class="pv-card" id="pcr-card">
        <div class="pv-label">PCR</div>
        <div class="pv-value" id="pcr-val">--</div>
        <div class="pv-sig"  id="pcr-sig">--</div>
    </div>
    <div class="pv-card" id="atm-pcr-card">
        <div class="pv-label">ATM PCR</div>
        <div class="pv-value" id="atm-pcr-val">--</div>
        <div class="pv-sig"  id="atm-pcr-sig">--</div>
    </div>
    <div class="pv-card" id="vix-card">
        <div class="pv-label">INDIA VIX</div>
        <div class="pv-value" id="vix-val">--</div>
        <div class="pv-sig"  id="vix-sig">--</div>
    </div>
</div>

<!-- Indicators -->
<div class="grid4">
    <div class="ind-card" id="rsi-card">
        <div class="ind-label">RSI (14)</div>
        <div class="ind-value" id="rsi-val">--</div>
    </div>
    <div class="ind-card" id="vwap-card">
        <div class="ind-label">VWAP</div>
        <div class="ind-value" id="vwap-val" style="font-size:13px;">--</div>
    </div>
    <div class="ind-card" id="ema-card">
        <div class="ind-label">EMA 9 / 21</div>
        <div class="ind-value" id="ema-val" style="font-size:12px;">--</div>
    </div>
    <div class="ind-card">
        <div class="ind-label">VIX NOTE</div>
        <div class="ind-value" id="vix-note" style="font-size:11px; color:#ffc400;">--</div>
    </div>
</div>

<!-- Reasons -->
<div class="reason-card">
    <div class="reason-title">📊 SIGNAL REASONING</div>
    <div id="reasons">
        <div class="reason-item">Waiting for market data...</div>
    </div>
</div>

<div class="footer" id="footer">
    <span class="dot offline" id="foot-dot"></span>
    Waiting...
</div>

<script>
function colorFor(sig) {
    if (!sig) return '#546e7a';
    if (sig === 'BULLISH' || sig === 'LOW' || sig === 'VERY LOW') return '#00e676';
    if (sig === 'BEARISH' || sig === 'VERY HIGH' || sig === 'EXTREME') return '#ff1744';
    if (sig === 'HIGH')    return '#ff7043';
    return '#ffc400';
}

async function fetchSignal() {
    try {
        const res  = await fetch('/api/signal');
        const data = await res.json();

        // Price
        const priceEl = document.getElementById('price');
        priceEl.textContent = data.nifty > 0
            ? data.nifty.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})
            : '--';

        const chg    = data.change    || 0;
        const chgPct = data.changePct || 0;
        const chgEl  = document.getElementById('change');
        chgEl.textContent = data.nifty > 0
            ? `${chg >= 0 ? '+' : ''}${chg.toFixed(2)} (${chgPct.toFixed(2)}%)`
            : 'Market closed';
        chgEl.className = 'price-change ' + (chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat');

        // Signal
        const sig     = data.signal || 'WAIT';
        const sigCard = document.getElementById('signal-card');
        document.getElementById('signal').textContent = sig;
        sigCard.className = 'signal-card ' +
            (sig === 'BUY CALL' ? 'buy-call' : sig === 'BUY PUT' ? 'buy-put' : 'wait');
        const conf = data.confidence || 0;
        document.getElementById('conf-bar').style.width  = conf + '%';
        document.getElementById('conf-text').textContent = `Confidence: ${conf}%`;

        // Strike Range
        document.getElementById('strike-range').textContent =
            data.strikeRange || 'ATM ±200';

        // Status dot
        const live = data.connected && data.nifty > 0;
        document.getElementById('dot').className      = 'dot ' + (live ? 'live' : 'offline');
        document.getElementById('foot-dot').className = 'dot ' + (live ? 'live' : 'offline');
        document.getElementById('status-txt').innerHTML =
            `<span class="dot ${live ? 'live' : 'offline'}" id="dot"></span>${live ? 'LIVE' : 'WAIT'}`;

        // PCR
        const pcrVal = document.getElementById('pcr-val');
        const pcrSig = document.getElementById('pcr-sig');
        const pcrCard= document.getElementById('pcr-card');
        if (data.pcr !== null && data.pcr !== undefined) {
            pcrVal.textContent   = data.pcr.toFixed(2);
            pcrSig.textContent   = data.pcrSignal || '--';
            pcrVal.style.color   = colorFor(data.pcrSignal);
            pcrSig.style.color   = colorFor(data.pcrSignal);
            pcrCard.style.borderLeft = `3px solid ${colorFor(data.pcrSignal)}`;
        }

        // ATM PCR
        const atmVal = document.getElementById('atm-pcr-val');
        const atmSig = document.getElementById('atm-pcr-sig');
        const atmCard= document.getElementById('atm-pcr-card');
        if (data.atmPcr !== null && data.atmPcr !== undefined) {
            atmVal.textContent = data.atmPcr.toFixed(2);
            atmSig.textContent = data.atmPcrSignal || '--';
            atmVal.style.color = colorFor(data.atmPcrSignal);
            atmSig.style.color = colorFor(data.atmPcrSignal);
            atmCard.style.borderLeft = `3px solid ${colorFor(data.atmPcrSignal)}`;
        }

        // VIX
        const vixVal = document.getElementById('vix-val');
        const vixSig = document.getElementById('vix-sig');
        const vixCard= document.getElementById('vix-card');
        if (data.vix !== null && data.vix !== undefined) {
            vixVal.textContent = data.vix.toFixed(2);
            vixSig.textContent = data.vixSignal || '--';
            vixVal.style.color = colorFor(data.vixSignal);
            vixSig.style.color = colorFor(data.vixSignal);
            vixCard.style.borderLeft = `3px solid ${colorFor(data.vixSignal)}`;
            document.getElementById('vix-note').textContent = data.vixNote || '--';
        }

        // RSI
        const rsiEl   = document.getElementById('rsi-val');
        const rsiCard = document.getElementById('rsi-card');
        if (data.rsi !== null && data.rsi !== undefined) {
            rsiEl.textContent  = data.rsi.toFixed(2);
            rsiEl.style.color  =
                data.rsi < 35 ? '#00e676' :
                data.rsi > 65 ? '#ff1744' : '#ffc400';
            rsiCard.style.borderLeft =
                `3px solid ${data.rsi < 35 ? '#00e676' : data.rsi > 65 ? '#ff1744' : '#ffc400'}`;
        }

        // VWAP
        const vwapEl   = document.getElementById('vwap-val');
        const vwapCard = document.getElementById('vwap-card');
        if (data.vwap) {
            vwapEl.textContent  = data.vwap.toLocaleString('en-IN');
            const ab = data.nifty > data.vwap;
            vwapEl.style.color  = ab ? '#00e676' : '#ff1744';
            vwapCard.style.borderLeft = `3px solid ${ab ? '#00e676' : '#ff1744'}`;
        }

        // EMA
        const emaEl   = document.getElementById('ema-val');
        const emaCard = document.getElementById('ema-card');
        if (data.ema9 && data.ema21) {
            emaEl.textContent  = `${data.ema9} / ${data.ema21}`;
            const bull = data.ema9 > data.ema21;
            emaEl.style.color  = bull ? '#00e676' : '#ff1744';
            emaCard.style.borderLeft = `3px solid ${bull ? '#00e676' : '#ff1744'}`;
        }

        // Reasons
        const reasonsEl = document.getElementById('reasons');
        if (data.reason && data.reason.length > 0) {
            reasonsEl.innerHTML = data.reason
                .map(r => `<div class="reason-item">${r}</div>`)
                .join('');
        }

        // Footer
        document.getElementById('footer').innerHTML =
            `<span class="dot ${live ? 'live' : 'offline'}"></span>` +
            (data.lastUpdated
                ? 'Updated: ' + new Date(data.lastUpdated)
                    .toLocaleTimeString('en-IN',{hour12:true})
                : 'Waiting...');

    } catch(e) {
        console.error('Fetch error:', e);
    }
}

setInterval(fetchSignal, 2000);
fetchSignal();
</script>
</body>
</html>
