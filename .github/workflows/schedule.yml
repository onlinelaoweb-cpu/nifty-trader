name: Vardaan Scheduler — Sleep & Wake

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)
    # NIFTY: Wake Mon-Fri 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 1-5'
    # NIFTY: Sleep Mon-Fri 3:30 PM IST = 10:00 AM UTC
    - cron: '0 10 * * 1-5'
    # BITCOIN: Wake Daily 7:00 PM IST = 1:30 PM UTC
    - cron: '30 13 * * *'
    # BITCOIN: Sleep Daily 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - nifty-wake
          - nifty-sleep
          - bitcoin-wake
          - bitcoin-sleep

jobs:
  nifty-wake:
    name: '☀️ Nifty WAKE (9:00 AM IST)'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'nifty-wake') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1-5')
    steps:
      - name: Wake Nifty Service (numReplicas = 1)
        run: |
          echo "🟢 Waking up Vardaan Nifty AI..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.NIFTY_SERVICE_ID }}\", environmentId: \"${{ secrets.NIFTY_ENVIRONMENT_ID }}\", input: { numReplicas: 1 }) }"
            }' \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "✅ Nifty AWAKE!"

  nifty-sleep:
    name: '🌙 Nifty SLEEP (3:30 PM IST)'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'nifty-sleep') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 1-5')
    steps:
      - name: Sleep Nifty Service (numReplicas = 0)
        run: |
          echo "🔴 Putting Vardaan Nifty AI to sleep..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.NIFTY_SERVICE_ID }}\", environmentId: \"${{ secrets.NIFTY_ENVIRONMENT_ID }}\", input: { numReplicas: 0 }) }"
            }' \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "✅ Nifty SLEEPING!"

  bitcoin-wake:
    name: '🟠 Bitcoin WAKE (7:00 PM IST)'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bitcoin-wake') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 13 * * *')
    steps:
      - name: Wake Bitcoin Service (numReplicas = 1)
        run: |
          echo "🟢 Waking up Vardaan Bitcoin AI..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.BITCOIN_SERVICE_ID }}\", environmentId: \"${{ secrets.BITCOIN_ENVIRONMENT_ID }}\", input: { numReplicas: 1 }) }"
            }' \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "✅ Bitcoin AWAKE!"

  bitcoin-sleep:
    name: '🌙 Bitcoin SLEEP (11:00 PM IST)'
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bitcoin-sleep') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 17 * * *')
    steps:
      - name: Sleep Bitcoin Service (numReplicas = 0)
        run: |
          echo "🔴 Putting Vardaan Bitcoin AI to sleep..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceUpdate(serviceId: \"${{ secrets.BITCOIN_SERVICE_ID }}\", environmentId: \"${{ secrets.BITCOIN_ENVIRONMENT_ID }}\", input: { numReplicas: 0 }) }"
            }' \
            https://backboard.railway.app/graphql/v2)
          echo "Response: $RESPONSE"
          echo "✅ Bitcoin SLEEPING!"