name: Vardaan Scheduler — Sleep & Wake

on:
  schedule:
    # All times in UTC (IST = UTC + 5:30)

    # ── NIFTY APP ──────────────────────────────────────────
    # Wake:  Mon-Fri 9:00 AM IST  = 3:30 AM UTC
    - cron: '30 3 * * 1-5'
    # Sleep: Mon-Fri 3:30 PM IST  = 10:00 AM UTC
    - cron: '0 10 * * 1-5'

    # ── BITCOIN APP ────────────────────────────────────────
    # Wake:  Daily 7:00 PM IST    = 1:30 PM UTC
    - cron: '30 13 * * *'
    # Sleep: Daily 11:00 PM IST   = 5:30 PM UTC
    - cron: '30 17 * * *'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - nifty-wake
          - nifty-sleep
          - bitcoin-wake
          - bitcoin-sleep

jobs:
  nifty-wake:
    name: '☀️ Nifty WAKE (9:00 AM IST)'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'nifty-wake' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 3')
    steps:
      - name: Resume Nifty Service
        run: |
          echo "🟢 Waking up Vardaan Nifty AI..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"production\", serviceId: \"${{ secrets.NIFTY_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
          echo "✅ Nifty service resumed!"

  nifty-sleep:
    name: '🌙 Nifty SLEEP (3:30 PM IST)'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'nifty-sleep' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 10')
    steps:
      - name: Suspend Nifty Service
        run: |
          echo "🔴 Putting Vardaan Nifty AI to sleep..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceSuspend(environmentId: \"production\", serviceId: \"${{ secrets.NIFTY_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
          echo "✅ Nifty service suspended!"

  bitcoin-wake:
    name: '🟠 Bitcoin WAKE (7:00 PM IST)'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bitcoin-wake' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 13')
    steps:
      - name: Resume Bitcoin Service
        run: |
          echo "🟢 Waking up Vardaan Bitcoin AI..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"production\", serviceId: \"${{ secrets.BITCOIN_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
          echo "✅ Bitcoin service resumed!"

  bitcoin-sleep:
    name: '🌙 Bitcoin SLEEP (11:00 PM IST)'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bitcoin-sleep' ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 17')
    steps:
      - name: Suspend Bitcoin Service
        run: |
          echo "🔴 Putting Vardaan Bitcoin AI to sleep..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceSuspend(environmentId: \"production\", serviceId: \"${{ secrets.BITCOIN_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
          echo "✅ Bitcoin service suspended!"
